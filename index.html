<style>

<body>
<div id="authScreen" class="auth-wrap"><div class="auth-box"><div class="auth-hdr"><div class="logo">The SISS Client Portal&#8482;</div><div class="logo-tag">Your private hub for capacity-based training, tracking, and guided progression.</div></div>

<div class="top-r"><div><div class="top-email" id="dispEmail">&#8212;</div><div class="top-role" id="dispRole">&#8212;</div></div><button class="btn btn-out" onclick="handleLogout()">Logout</button></div></div>
<div class="sess-bar"><span>Session auto-logout:</span><span class="tm" id="timerDisplay">02:00:00</span></div>
<div class="nav" id="navBar"></div><div class="main" id="mainContent"></div></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCpF4ykT6BCmfNXTR-o5fsdwMqmsLO5VDA",authDomain:"rebuild-and-rise.firebaseapp.com",projectId:"rebuild-and-rise",storageBucket:"rebuild-and-rise.firebasestorage.app",messagingSenderId:"87951065832",appId:"1:87951065832:web:840c590cfa0580600b3f5d"});
var auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
var SESSION_MS=2*60*60*1000,lastAct=Date.now(),tmrInt=null,CUR=null,CDATA=null,exercises=[],allClients=[],allSessions=[],allProgress=[],allBooked=[];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var TIMES=[];for(var h=5;h<=21;h++)for(var m=0;m<60;m+=15){var hr=h>12?h-12:h===0?12:h;TIMES.push({v:(h<10?'0':'')+h+':'+(m<10?'0':'')+m,l:hr+':'+(m<10?'0':'')+m+' '+(h>=12?'PM':'AM')})}
function devId(){var i=localStorage.getItem('siss_dev');if(!i){i='d_'+Math.random().toString(36).substr(2,10)+'_'+Date.now();localStorage.setItem('siss_dev',i)}return i}
function timeAgo(d){var s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function todayStr(){return new Date().toISOString().split('T')[0]}
function fmtDate(ds){var d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

// AUTH
auth.onAuthStateChanged(function(u){if(u){db.collection('users').doc(u.uid).get().then(function(d){CUR=u;CDATA=d.exists?d.data():{accountType:'client',name:'',email:u.email};showShell()}).catch(function(){CUR=u;CDATA={accountType:'client'};showShell()})}else{showAuth()}});
function showForm(t){document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('signupForm').classList.toggle('hidden',t!=='signup');hideMsg()}
function handleForgotPassword(){var e=document.getElementById('loginEmail').value.trim();if(!e){showMsg('Enter your email address first, then click Forgot Password.','error');return}auth.sendPasswordResetEmail(e).then(function(){showMsg('Password reset email sent to '+e+'. Check your inbox.','success')}).catch(function(err){showMsg('Error: '+err.message,'error')})}
function handleLogin(){var e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPassword').value;if(!e||!p){showMsg('Enter email and password.','error');return}var b=document.getElementById('loginBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Logging in...';auth.signInWithEmailAndPassword(e,p).then(function(c){return db.collection('users').doc(c.user.uid).set({lastDeviceId:devId(),lastLoginTime:TS()},{merge:true})}).catch(function(err){showMsg('Login failed. '+err.message,'error');b.disabled=false;b.innerHTML='Login'})}
function handleSignup(){var n=document.getElementById('signupName').value.trim(),e=document.getElementById('signupEmail').value.trim(),p=document.getElementById('signupPassword').value,r=document.getElementById('signupRole').value;if(!n||!e||!p){showMsg('Fill in all fields.','error');return}if(p.length<6){showMsg('Password 6+ chars.','error');return}var b=document.getElementById('signupBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Creating...';auth.createUserWithEmailAndPassword(e,p).then(function(c){return db.collection('users').doc(c.user.uid).set({email:e,name:n,accountType:r,lastDeviceId:devId(),createdAt:TS(),lastLoginTime:TS()})}).catch(function(err){showMsg('Signup failed. '+err.message,'error');b.disabled=false;b.innerHTML='Create Account'})}
function handleLogout(){if(tmrInt)clearInterval(tmrInt);auth.signOut()}
function showAuth(){document.getElementById('authScreen').style.display='flex';document.getElementById('shell').classList.remove('on');['loginBtn','signupBtn'].forEach(function(id){var b=document.getElementById(id);if(b){b.disabled=false;b.innerHTML=id==='loginBtn'?'Login':'Create Account'}});showForm('login');hideMsg()}
function showMsg(t,tp){var b=document.getElementById('msgBox');b.textContent=t;b.className='msg '+tp+' vis'}
function hideMsg(){document.getElementById('msgBox').className='msg'}
function toast(t){var d=document.createElement('div');d.style.cssText='position:fixed;top:20px;right:20px;background:#E8F5E9;color:#4CAF50;padding:14px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function startTimer(){lastAct=Date.now();['click','keydown','scroll','touchstart'].forEach(function(e){document.addEventListener(e,function(){lastAct=Date.now()},{passive:true})});if(tmrInt)clearInterval(tmrInt);tmrInt=setInterval(function(){var r=Math.max(0,SESSION_MS-(Date.now()-lastAct));document.getElementById('timerDisplay').textContent=String(Math.floor(r/3600000)).padStart(2,'0')+':'+String(Math.floor((r%3600000)/60000)).padStart(2,'0')+':'+String(Math.floor((r%60000)/1000)).padStart(2,'0');if(r<=0){clearInterval(tmrInt);handleLogout()}var bar=document.querySelector('.sess-bar');if(r<300000){bar.style.background='linear-gradient(135deg,#FFEBEE,#FFCDD2)';bar.style.color='#C62828'}else{bar.style.background='';bar.style.color=''}},1000)}

function showShell(){document.getElementById('authScreen').style.display='none';document.getElementById('shell').classList.add('on');document.getElementById('dispEmail').textContent=CUR.email;var isC=CDATA.accountType==='coach';document.getElementById('dispRole').textContent=isC?'Coach':'Client';document.getElementById('dashTitle').textContent=isC?'SISS Portal \u2014 Coach View':'SISS Portal \u2014 My Dashboard';buildNav(isC);startTimer()}

function buildNav(isC){var nav=document.getElementById('navBar'),main=document.getElementById('mainContent');nav.innerHTML='';main.innerHTML='';
var tabs=isC?[{id:'dashboard',label:'Dashboard'},{id:'clients',label:'Clients'},{id:'builder',label:'Create Workout'},{id:'library',label:'Workout Library'},{id:'schedule',label:'Schedule'}]:[{id:'dashboard',label:'Dashboard'},{id:'capacity',label:'Capacity Check-In'},{id:'tracker',label:'Tracker'},{id:'guides',label:'Guides'},{id:'programs',label:'Programs'},{id:'schedule',label:'Schedule'},{id:'messages',label:'Messages'}];
tabs.forEach(function(t,i){var tab=document.createElement('div');tab.className='nav-tab'+(i===0?' on':'');tab.textContent=t.label;tab.dataset.tab=t.id;
tab.onclick=function(){nav.querySelectorAll('.nav-tab').forEach(function(n){n.classList.remove('on')});tab.classList.add('on');main.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('on')});document.getElementById('panel-'+t.id).classList.add('on');loadTab(t.id)};
nav.appendChild(tab);var panel=document.createElement('div');panel.id='panel-'+t.id;panel.className='tab-panel'+(i===0?' on':'');main.appendChild(panel)});
if(isC){loadCoachData().then(function(){buildCoachDashboard();buildWorkoutCreator()})}else{buildClientDashboard();buildCapacityTab();buildTrackerTab();buildGuidesTab();buildProgramsTab();buildClientScheduleTab();buildMessagesTab()}}

function loadTab(id){var isC=CDATA.accountType==='coach';if(isC){if(id==='dashboard')loadCoachData().then(buildCoachDashboard);if(id==='clients')buildClientsTab();if(id==='builder')buildWorkoutCreator();if(id==='library')buildLibraryTab();if(id==='schedule')loadCoachData().then(buildCoachSchedule)}else{if(id==='dashboard')buildClientDashboard();if(id==='capacity')buildCapacityTab();if(id==='tracker')buildTrackerTab();if(id==='programs')buildProgramsTab();if(id==='schedule')buildClientScheduleTab()}}

function loadCoachData(){return Promise.all([
db.collection('users').where('accountType','==','client').get(),
db.collection('scheduledSessions').where('coachId','==',CUR.uid).get(),
db.collection('clientProgress').where('coachId','==',CUR.uid).get(),
db.collection('bookedSlots').get()
]).then(function(res){
allClients=[];res[0].forEach(function(d){allClients.push({id:d.id,...d.data()})});
allSessions=[];res[1].forEach(function(d){allSessions.push({id:d.id,...d.data()})});
allProgress=[];res[2].forEach(function(d){allProgress.push({id:d.id,...d.data()})});
allBooked=[];res[3].forEach(function(d){allBooked.push({id:d.id,...d.data()})});
}).catch(function(e){console.error('loadCoachData:',e)})}

// ===== COACH DASHBOARD =====
var coachAvail={};
function buildCoachDashboard(){var p=document.getElementById('panel-dashboard');
var statusHtml='';allClients.forEach(function(c){var asgn=allSessions.filter(function(s){return s.assignedClients&&s.assignedClients.indexOf(c.id)>=0}).length;var comp=allProgress.filter(function(pr){return pr.clientId===c.id}).length;var missed=asgn-comp;var ll=c.lastLoginTime&&c.lastLoginTime.toDate?c.lastLoginTime.toDate():null;var dsl=ll?Math.floor((Date.now()-ll.getTime())/864e5):999;
var st='green',si='\uD83D\uDFE2',stxt='On track';if(missed>=3||!c.lastLoginTime){st='red';si='\uD83D\uDD34';stxt=missed>=3?'Missed '+missed+' workouts':'No activity'}else if(missed>=2||dsl>=2){st='yellow';si='\uD83D\uDFE1';stxt=dsl>=2?'Inactive '+dsl+'d':'Missed '+missed}
statusHtml+='<div class="status-card '+st+'"><div><div class="status-name">'+(c.name||c.email)+'</div><div class="status-detail">'+stxt+' \u00B7 '+comp+'/'+asgn+' completed</div></div><div class="status-badge">'+si+'</div></div>'});

var feedItems=[];allProgress.forEach(function(pr){var cl=allClients.find(function(c){return c.id===pr.clientId});feedItems.push({text:(cl?cl.name||cl.email:'?')+' completed "'+pr.title+'"',time:pr.completedAt&&pr.completedAt.toDate?pr.completedAt.toDate():null,dot:'green'})});
allSessions.forEach(function(s){feedItems.push({text:'You published "'+s.title+'" ('+(s.assignedClients?s.assignedClients.length:0)+' client(s))',time:s.createdAt&&s.createdAt.toDate?s.createdAt.toDate():null,dot:'blue'})});
feedItems.sort(function(a,b){return(b.time?b.time.getTime():0)-(a.time?a.time.getTime():0)});feedItems=feedItems.slice(0,10);
var feedHtml=feedItems.length?feedItems.map(function(f){return'<div class="feed-item"><div class="feed-dot '+f.dot+'"></div><div><div class="feed-text">'+f.text+'</div><div class="feed-time">'+(f.time?timeAgo(f.time):'')+'</div></div></div>'}).join(''):'<div class="empty"><div class="empty-text">No activity yet</div></div>';

p.innerHTML='<div class="banner"><h2>Welcome Back, Coach</h2><p>Manage your clients, create workouts, and track progress.</p></div><div class="igrid3"><div class="ibox"><div class="ibox-l">Total Clients</div><div class="ibox-v">'+allClients.length+'</div></div><div class="ibox"><div class="ibox-l">Workouts</div><div class="ibox-v">'+allSessions.length+'</div></div><div class="ibox"><div class="ibox-l">Completions</div><div class="ibox-v">'+allProgress.length+'</div></div></div><div class="card" style="margin-top:18px"><div class="card-t">Program Status</div>'+(statusHtml||'<div class="empty"><div class="empty-text">No clients yet</div></div>')+'</div><div class="card"><div class="card-t">Activity Feed</div>'+feedHtml+'</div><div class="card"><div class="card-t">Set Your Weekly Availability</div><div class="card-c" style="margin-bottom:14px">Add multiple time slots per day. Use breaks between slots.</div><div id="coachAvail"></div><button class="btn btn-p" style="margin-top:14px" onclick="saveAvailability()">Save Availability</button><div id="availMsg" class="msg" style="margin-top:8px"></div></div>';
loadAvailability()}

function loadAvailability(){db.collection('coachAvailability').doc(CUR.uid).get().then(function(d){if(d.exists)coachAvail=d.data().slots||{};renderAvailability()}).catch(function(){renderAvailability()})}

function renderAvailability(){var el=document.getElementById('coachAvail');if(!el)return;var html='';var now=new Date();
for(var dow=0;dow<7;dow++){var slots=coachAvail[dow]||[];var dd=new Date(now);dd.setDate(now.getDate()+(dow-now.getDay()));var dateLabel=dd.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
html+='<div class="avail-day"><div class="avail-day-hdr"><div><div class="avail-day-name">'+DAYS[dow]+'</div><div class="avail-day-date">'+dateLabel+'</div></div><span style="font-size:12px;color:var(--txt3)">'+(slots.length?slots.length+' slot(s)':'Off')+'</span></div>';
for(var si=0;si<slots.length;si++){var slot=slots[si];html+='<div class="avail-slot-row"><select class="avail-sel" onchange="updateSlot('+dow+','+si+',\'from\',this.value)">';for(var ti=0;ti<TIMES.length;ti++){html+='<option value="'+TIMES[ti].v+'"'+(slot.from===TIMES[ti].v?' selected':'')+'>'+TIMES[ti].l+'</option>'}html+='</select><span class="avail-sep">to</span><select class="avail-sel" onchange="updateSlot('+dow+','+si+',\'to\',this.value)">';for(var ti2=0;ti2<TIMES.length;ti2++){html+='<option value="'+TIMES[ti2].v+'"'+(slot.to===TIMES[ti2].v?' selected':'')+'>'+TIMES[ti2].l+'</option>'}html+='</select><button class="avail-rm" onclick="rmSlot('+dow+','+si+')">\u2715</button></div>'}
html+='<button class="avail-add" onclick="addSlot('+dow+')">+ Add Time Slot</button><div class="copy-btns"><button class="btn btn-sm btn-s" onclick="copyPrev('+dow+')">Copy from prev day</button><button class="btn btn-sm btn-s" onclick="copyWeek('+dow+')">Copy to rest of week</button></div></div>'}
el.innerHTML=html}

function addSlot(dow){if(!coachAvail[dow])coachAvail[dow]=[];coachAvail[dow].push({from:'09:00',to:'12:00'});renderAvailability()}
function rmSlot(dow,idx){if(coachAvail[dow])coachAvail[dow].splice(idx,1);renderAvailability()}
function updateSlot(dow,idx,field,val){if(coachAvail[dow]&&coachAvail[dow][idx])coachAvail[dow][idx][field]=val}
function copyPrev(dow){var prev=dow===0?6:dow-1;if(coachAvail[prev]&&coachAvail[prev].length){coachAvail[dow]=JSON.parse(JSON.stringify(coachAvail[prev]));renderAvailability();toast('Copied!')}}
function copyWeek(dow){if(!coachAvail[dow]||!coachAvail[dow].length){toast('Add slots first');return}for(var i=dow+1;i<7;i++){coachAvail[i]=JSON.parse(JSON.stringify(coachAvail[dow]))}renderAvailability();toast('Copied to rest of week!')}
function saveAvailability(){db.collection('coachAvailability').doc(CUR.uid).set({slots:coachAvail,updatedAt:TS()}).then(function(){var m=document.getElementById('availMsg');m.className='msg success vis';m.textContent='Availability saved!';setTimeout(function(){m.classList.remove('vis')},3000)}).catch(function(e){var m=document.getElementById('availMsg');m.className='msg error vis';m.textContent='Error: '+e.message})}

// ===== CLIENTS TAB =====
function buildClientsTab(){var p=document.getElementById('panel-clients');if(!allClients.length){p.innerHTML='<div class="card"><div class="card-t">Your Clients</div><div class="empty"><div class="empty-icon">\uD83D\uDC65</div><div class="empty-text">No clients yet</div></div></div>';return}
var h='<div class="card"><div class="card-t">Your Clients</div>';
allClients.forEach(function(c){var prog=allProgress.filter(function(pr){return pr.clientId===c.id});var asgn=allSessions.filter(function(s){return s.assignedClients&&s.assignedClients.indexOf(c.id)>=0});var missed=asgn.length-prog.length;var bg='badge-g',bt='On Track';if(missed>=3){bg='badge-r';bt='Needs Attention'}else if(missed>=2){bg='badge-y';bt='Watch'}
h+='<div class="cl-row" onclick="showClientDetail(\''+c.id+'\')"><div><div class="cl-name">'+(c.name||'Unnamed')+'</div><div class="cl-email">'+c.email+'</div></div><span class="badge '+bg+'">'+bt+'</span></div>'});
h+='</div><div id="clientDetailArea"></div>';p.innerHTML=h}

function showClientDetail(cid){var c=allClients.find(function(x){return x.id===cid});if(!c)return;
var prog=allProgress.filter(function(pr){return pr.clientId===cid});var asgn=allSessions.filter(function(s){return s.assignedClients&&s.assignedClients.indexOf(cid)>=0});
var progH=prog.length?prog.slice(0,5).map(function(pr){var zb=pr.capacityLevel==='green'?'g':pr.capacityLevel==='yellow'?'y':'r';return'<div style="padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px"><div style="display:flex;justify-content:space-between"><strong>\u2713 '+pr.title+'</strong><span class="badge badge-'+zb+'">'+(pr.capacityLevel||'\u2014')+'</span></div><div style="font-size:11px;color:var(--txt3)">'+(pr.completedAt&&pr.completedAt.toDate?pr.completedAt.toDate().toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+'</div></div>'}).join(''):'<span style="color:var(--txt3);font-size:13px">None yet</span>';
var pct=asgn.length?Math.round(prog.length/asgn.length*100):0;
document.getElementById('clientDetailArea').innerHTML='<div class="card"><div class="card-t">'+(c.name||c.email)+' \u2014 Details</div><div class="client-detail"><div class="cd-section"><div class="cd-title">Progress ('+prog.length+'/'+asgn.length+')</div><div style="background:var(--bdr);border-radius:4px;height:8px;margin:8px 0"><div style="background:var(--ok);height:100%;border-radius:4px;width:'+pct+'%"></div></div></div><div class="cd-section"><div class="cd-title">Recent Completions</div>'+progH+'</div><div class="cd-section"><div class="cd-title">Account Info</div><div style="font-size:13px;color:var(--txt2)">Email: '+c.email+'<br>Joined: '+(c.createdAt&&c.createdAt.toDate?c.createdAt.toDate().toLocaleDateString():'')+'<br>Last Login: '+(c.lastLoginTime&&c.lastLoginTime.toDate?timeAgo(c.lastLoginTime.toDate()):'')+'</div></div></div></div>';
document.getElementById('clientDetailArea').scrollIntoView({behavior:'smooth'})}

// ===== WORKOUT BUILDER =====
function buildWorkoutCreator(){exercises=[{name:'',type:'General',sets:'',reps:'',weight:'',tempo:'',videoLink:''}];

var capAnswers={sleep:0,soreness:0,emotional:0,focus:0,energy:0,trueCap:0};
function buildCapacityTab(){var p=document.getElementById('panel-capacity');
var qs=[{key:'sleep',label:'How well did you sleep last night?',low:'Barely slept',high:'Deep, restful'},{key:'soreness',label:'How sore is your body?',low:'Very sore',high:'Fresh'},{key:'emotional',label:'Emotional load right now?',low:'Overwhelmed',high:'Light, balanced'},{key:'energy',label:'Energy level?',low:'Exhausted',high:'High energy'},{key:'focus',label:'How focused do you feel?',low:'Scattered',high:'Locked in'},{key:'trueCap',label:'TRUE CAPACITY: Mind + Body aligned?',low:'Mind pushing, body resisting',high:'Fully aligned'}];
var h='<div class="cap-wrap"><div class="card-t" style="color:var(--acc-l);text-align:center;font-size:20px;margin-bottom:4px">Daily Capacity Check-In</div><div class="card-c" style="text-align:center;margin-bottom:28px">Rate each area honestly. This determines your training zone.</div>';
qs.forEach(function(q){h+='<div class="cap-q"><div class="cap-q-title">'+q.label+'</div><div class="cap-hints"><span>'+q.low+'</span><span>'+q.high+'</span></div><div class="cap-range">';for(var n=1;n<=5;n++){h+='<button class="cap-card" onclick="setCapScore(\''+q.key+'\','+n+',this)">'+n+'</button>'}h+='</div></div>'});

function submitCapacity(){var a=capAnswers;if(!a.sleep||!a.soreness||!a.emotional||!a.focus||!a.energy||!a.trueCap){toast('Rate all 6 areas first.');return}
var score=a.trueCap*3+a.emotional*2.5+a.sleep*2+a.energy*1.5+a.focus*1+a.soreness*1;
var zone='green';
if(a.trueCap<=2)zone='red';

else if(score>=40)zone='green';else if(score>=25)zone='yellow';else zone='red';

document.getElementById('capResult').innerHTML='<div class="cap-result '+zone+'"><div class="cap-zone">'+msgs[zone].title+'</div><div class="cap-msg">"'+msgs[zone].msg+'"</div><div class="pill-group">'+pillH+'</div><button class="btn btn-p" style="margin-top:16px;max-width:300px;margin-left:auto;margin-right:auto;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="saveCapacity(\''+zone+'\')">Log Today\'s Capacity</button></div>';

db.collection('capacityCheckins').doc(CUR.uid+'_'+todayStr()).set({clientId:CUR.uid,date:todayStr(),scores:a,weightedScore:score,zone:zone,timestamp:TS()}).catch(function(e){console.error(e)})}

function setMeal(i,type,btn){mealData[i]=type;btn.parentElement.querySelectorAll('.meal-btn').forEach(function(b){b.classList.remove('check','x','miss')});btn.classList.add(type)}
function adjWater(amt){waterOz=Math.max(0,waterOz+amt);document.getElementById('waterDisplay').textContent=waterOz}
function saveMealLog(){db.collection('mealAdherence').doc(CUR.uid+'_'+todayStr()).set({clientId:CUR.uid,date:todayStr(),meals:mealData,waterOz:waterOz,timestamp:TS()}).then(function(){var m=document.getElementById('mealMsg');m.className='msg success vis';m.textContent='Meal log saved!'}).catch(function(e){var m=document.getElementById('mealMsg');m.className='msg error vis';m.textContent=e.message})}
function loadMealLog(){db.collection('mealAdherence').doc(CUR.uid+'_'+todayStr()).get().then(function(d){if(d.exists){mealData=d.data().meals||[0,0,0,0,0,0];waterOz=d.data().waterOz||0;document.getElementById('waterDisplay').textContent=waterOz;mealData.forEach(function(v,i){if(v){var btns=document.querySelectorAll('.meal-slot')[i];if(btns){var bs=btns.querySelectorAll('.meal-btn');bs.forEach(function(b){b.classList.remove('check','x','miss')});if(v==='check')bs[0].classList.add('check');else if(v==='x')bs[1].classList.add('x');else if(v==='miss')bs[2].classList.add('miss')}}})}}).catch(function(){})}
var foodCount=1;function addFoodEntry(){var el=document.getElementById('foodEntries');var div=document.createElement('div');div.className='food-entry';div.innerHTML='<input class="wb-input" placeholder="What did you eat/drink?" id="food'+foodCount+'">';el.appendChild(div);foodCount++}
function saveFoodDiary(){var entries=[];for(var i=0;i<foodCount;i++){var inp=document.getElementById('food'+i);if(inp&&inp.value.trim())entries.push(inp.value.trim())}if(!entries.length){var m=document.getElementById('foodMsg');m.className='msg error vis';m.textContent='Add at least one entry.';return}
db.collection('foodDiary').doc(CUR.uid+'_'+todayStr()).set({clientId:CUR.uid,date:todayStr(),entries:entries,timestamp:TS()}).then(function(){var m=document.getElementById('foodMsg');m.className='msg success vis';m.textContent='Food diary saved!'}).catch(function(e){var m=document.getElementById('foodMsg');m.className='msg error vis';m.textContent=e.message})}

// ===== GUIDES =====
function buildGuidesTab(){document.getElementById('panel-guides').innerHTML='<div class="card"><div class="card-t">SISS Method Guides</div><div class="empty"><div class="empty-icon">\uD83D\uDCD6</div><div class="empty-text">Guides coming soon</div></div></div>'}

// ===== PROGRAMS TAB =====
function buildProgramsTab(){var p=document.getElementById('panel-programs');
db.collection('scheduledSessions').where('assignedClients','array-contains',CUR.uid).where('isPublished','==',true).get().then(function(snap){var assigned=[];snap.forEach(function(d){assigned.push({id:d.id,...d.data()})});
return db.collection('clientProgress').where('clientId','==',CUR.uid).get().then(function(progSnap){var completions={};progSnap.forEach(function(d){var pr=d.data();completions[pr.sessionId]={capacityLevel:pr.capacityLevel,completedAt:pr.completedAt&&pr.completedAt.toDate?pr.completedAt.toDate():null}});
if(!assigned.length){p.innerHTML='<div class="card"><div class="card-t">My Programs</div><div class="empty"><div class="empty-icon">\uD83C\uDFCB\uFE0F</div><div class="empty-text">No programs assigned yet</div></div></div>';return}
var done=assigned.filter(function(s){return completions[s.id]}).length;var pct=assigned.length?Math.round(done/assigned.length*100):0;
var sessH='';assigned.forEach(function(s){var comp=completions[s.id];var zIcon=comp?(comp.capacityLevel==='green'?'\uD83D\uDFE2':comp.capacityLevel==='yellow'?'\uD83D\uDFE1':'\uD83D\uDD34'):'';
sessH+='<div class="prog-sess-item"><div><div style="font-weight:600;font-size:14px">'+(comp?'\u2705':'\u2B1C')+' '+s.title+'</div>'+(comp?'<div style="font-size:12px;color:var(--txt2);margin-top:2px">Completed '+(comp.completedAt?comp.completedAt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+' \u00B7 '+zIcon+' '+(comp.capacityLevel||'')+' zone</div>':'<div style="font-size:12px;color:var(--txt3);margin-top:2px">'+(s.scheduledDate?fmtDate(s.scheduledDate)+' '+(s.scheduledTime||''):'Not yet completed')+'</div>')+'</div><span class="'+(comp?'prog-sess-done':'prog-sess-pending')+'">'+(comp?'Done':'Upcoming')+'</span></div>'});

p.innerHTML='<div class="card"><div class="card-t">My Programs</div><button class="prog-pill" onclick="document.getElementById(\'progDetail\').classList.toggle(\'hidden\')">\uD83C\uDFCB\uFE0F My Training Program <span style="font-size:12px;opacity:.8;margin-left:8px">'+done+'/'+assigned.length+' completed</span></button><div style="background:var(--bdr);border-radius:4px;height:6px;margin-bottom:16px"><div style="background:var(--ok);height:100%;border-radius:4px;width:'+pct+'%;transition:width .3s"></div></div><div id="progDetail"><div class="prog-sessions">'+sessH+'</div></div></div>'})}).catch(function(e){p.innerHTML='<div class="card"><div class="empty"><div class="empty-text">Error loading programs</div></div></div>'})}

// ===== CLIENT SCHEDULE =====
var COACH_ID='SiLBhpTMb5Q42FLceYTjlkXdl3p1';
function buildClientScheduleTab(){var p=document.getElementById('panel-schedule');
p.innerHTML='<div class="card"><div class="card-t">My Schedule</div><div id="clientSchedContent"><div class="empty"><div class="empty-text">Loading...</div></div></div></div><button class="add-sched-btn" onclick="openBookModal()">+</button>';
renderClientSched()}

function renderClientSched(){var el=document.getElementById('clientSchedContent');if(!el)return;
Promise.all([
db.collection('bookedSlots').where('clientId','==',CUR.uid).get(),
db.collection('scheduledSessions').where('assignedClients','array-contains',CUR.uid).where('isPublished','==',true).get()
]).then(function(res){
var booked=[];res[0].forEach(function(d){booked.push({id:d.id,...d.data()})});
var sessions=[];res[1].forEach(function(d){sessions.push({id:d.id,...d.data()})});
booked.sort(function(a,b){return(a.date+a.time).localeCompare(b.date+b.time)});

var upcoming=booked.filter(function(b){return b.date>=todayStr()});
if(!upcoming.length&&!sessions.length){el.innerHTML='<div style="padding:12px;color:var(--txt3);font-size:13px;text-align:center">No upcoming sessions. Tap + to book.</div>';return}

var h='';upcoming.forEach(function(bk){
var sess=sessions.find(function(s){return s.bookedSlotId===bk.id});
h+='<div class="booked-slot"><div class="slot-info"><div class="slot-date">'+fmtDate(bk.date)+'</div><div class="slot-time">'+(bk.timeDisplay||bk.time)+'</div>';
if(sess){h+='<div class="slot-workout">\u2705 '+sess.title+' \u00B7 '+(sess.type||'Workout')+' \u00B7 40 min</div>'}else{h+='<div style="font-size:12px;color:var(--warn);margin-top:4px">\u23F3 Awaiting coach assignment</div>'}
h+='</div></div>'});
el.innerHTML=h}).catch(function(e){el.innerHTML='<div class="empty"><div class="empty-text">Error loading schedule</div></div>'})}

function openBookModal(){continueBooking()}
function continueBooking(){
db.collection('coachAvailability').doc(COACH_ID).get().then(function(ad){
console.log('Availability doc exists:',ad.exists);console.log('Availability data:',ad.data());
var avail=ad.exists?ad.data().slots||{}:{};
console.log('Parsed availability:',avail);
if(!Object.keys(avail).length){alert('No available times to book right now. Please try again later.');return}
return db.collection('bookedSlots').get().then(function(bs){
var takenSlots=[];bs.forEach(function(d){takenSlots.push(d.data())});
var daysHtml='';var now=new Date();
for(var i=1;i<=14;i++){var d=new Date(now);d.setDate(now.getDate()+i);var dow=d.getDay();var dowStr=String(dow);
if(!avail[dowStr]||!avail[dowStr].length)continue;
var dateStr=d.toISOString().split('T')[0];var dateLabel=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
var slotHtml='';
avail[dowStr].forEach(function(slot){var from=slot.from,to=slot.to;TIMES.forEach(function(t){if(t.v>=from&&t.v<to){var taken=takenSlots.find(function(ts){return ts.date===dateStr&&ts.time===t.v});
slotHtml+='<button class="btn btn-sm '+(taken?'btn-s':'btn-p')+'" style="margin:3px;'+(taken?'opacity:.4;cursor:not-allowed':'')+'" '+(taken?'disabled':'')+' onclick="bookSlot(\''+dateStr+'\',\''+t.v+'\',\''+t.l+'\',\''+dateLabel+'\')">'+t.l+(taken?' \u2715':'')+'</button>'}})});
if(slotHtml)daysHtml+='<div style="margin-bottom:16px"><div style="font-weight:600;font-size:14px;color:var(--pri);margin-bottom:8px">'+dateLabel+'</div><div style="display:flex;flex-wrap:wrap">'+slotHtml+'</div></div>'}

var modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML='<div class="modal"><div class="modal-t"><span>Schedule a Session</span><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">✕</button></div><div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Select an available time slot. Your coach will assign your workout.</div>'+(daysHtml||'<div class="empty"><div class="empty-text">No available slots</div><div class="empty-sub">Coach has not set availability yet</div></div>')+'</div>';
document.body.appendChild(modal)})}).catch(function(e){alert('Error loading availability')})}

function bookSlot(date,time,timeDisplay,dateLabel){
db.collection('bookedSlots').where('date','==',date).where('time','==',time).get().then(function(existing){
if(!existing.empty){alert('Slot taken!');return}
return db.collection('bookedSlots').add({clientId:CUR.uid,clientName:CDATA.name||CUR.email,date:date,time:time,timeDisplay:timeDisplay,dateLabel:dateLabel,createdAt:TS()}).then(function(){
document.querySelector('.modal-overlay').remove();toast('Booked: '+dateLabel+' '+timeDisplay);renderClientSched()})}).catch(function(e){alert('Error: '+e.message)})}

function buildMessagesTab(){document.getElementById('panel-messages').innerHTML='<div class="card"><div class="card-t">Messages</div><div class="empty"><div class="empty-icon">\uD83D\uDCAC</div><div class="empty-text">Messaging coming soon</div></div></div>'}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('authScreen').style.display!=='none'){if(!document.getElementById('loginForm').classList.contains('hidden'))handleLogin();else handleSignup()}});
</script>
