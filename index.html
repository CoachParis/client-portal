<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SISS Client Portal™</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#734A5A;--pri-l:#8B5C70;--pri-d:#5A3849;--acc:#A67C92;--acc-l:#D4B5C8;--bg:#FAF8F6;--bg2:#F3EEEA;--bdr:#E8DED7;--txt:#2C2C2C;--txt2:#666;--txt3:#999;--ok:#4CAF50;--warn:#FF9800;--err:#F44336;--blue:#2196F3;--radius:10px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;font-size:14px}
.hidden{display:none!important}
/* AUTH */
.auth-wrap{display:flex;height:100vh;background:linear-gradient(135deg,var(--pri),var(--pri-d))}.auth-box{width:100%;max-width:430px;margin:auto;background:#fff;border-radius:16px;padding:40px 34px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-hdr{text-align:center;margin-bottom:32px}.logo{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;color:var(--pri);letter-spacing:.4px}.logo-tag{color:var(--txt2);font-size:12px;line-height:1.5;max-width:320px;margin:8px auto 0}
.fg{margin-bottom:18px}.fg label{display:block;margin-bottom:5px;font-weight:500;font-size:13px}.fg input,.fg select{width:100%;padding:11px 14px;border:1px solid var(--bdr);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;transition:border .2s}.fg input:focus,.fg select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(115,74,90,.1)}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d)}.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--bg2);color:var(--pri);margin-top:10px}.btn-s:hover{background:var(--bdr)}
.btn-sm{width:auto;padding:8px 16px;font-size:13px;border-radius:6px}
.btn-out{background:var(--err);color:#fff;width:auto;padding:7px 14px;font-size:12px;border-radius:6px}.btn-out:hover{background:#D32F2F}
.btn-green{background:var(--ok);color:#fff}.btn-green:hover{background:#388E3C}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{background:#F57C00}
.msg{padding:11px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}.msg.error{background:#FFEBEE;color:var(--err);border-left:4px solid var(--err)}.msg.success{background:#E8F5E9;color:var(--ok);border-left:4px solid var(--ok)}.msg.vis{display:block}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* SHELL */
.shell{display:none;height:100vh;flex-direction:column}.shell.on{display:flex}
.top-bar{background:#fff;border-bottom:1px solid var(--bdr);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.top-l{display:flex;flex-direction:column}.top-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--pri)}.top-sub{font-size:10px;color:var(--acc);margin-top:1px;letter-spacing:.3px;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:14px}.top-email{font-size:12px;color:var(--txt);font-weight:500;text-align:right}.top-role{font-size:10px;color:var(--acc)}
.sess-bar{background:linear-gradient(135deg,#FFF3E0,#FFF8E1);border-bottom:1px solid #FFE0B2;padding:6px 24px;display:flex;justify-content:space-between;font-size:11px;color:#E65100}.sess-bar .tm{font-weight:700;font-size:13px}
.nav{background:#fff;border-bottom:1px solid var(--bdr);display:flex;padding:0;gap:0;overflow-x:auto}.nav-tab{padding:12px 16px;font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;user-select:none}.nav-tab:hover{color:var(--pri);background:var(--bg)}.nav-tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.main{flex:1;overflow-y:auto;padding:24px}.tab-panel{display:none}.tab-panel.on{display:block}
/* CARDS */
.card{background:#fff;border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.03)}
.card-t{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--pri-d);margin-bottom:12px}.card-c{font-size:13px;color:var(--txt2);line-height:1.7}
.banner{background:linear-gradient(135deg,var(--pri),var(--pri-l));border-radius:var(--radius);padding:24px 28px;margin-bottom:22px;color:#fff}.banner h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin-bottom:6px}.banner p{font-size:13px;opacity:.9}
.igrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px}
.ibox{background:var(--bg2);padding:14px;border-radius:8px;text-align:center}.ibox-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}.ibox-v{font-size:17px;font-weight:700;color:var(--pri)}
.status-card{border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}.status-card:hover{transform:translateX(4px)}
.status-card.green{background:#E8F5E9;border-left:4px solid var(--ok)}.status-card.yellow{background:#FFF8E1;border-left:4px solid var(--warn)}.status-card.red{background:#FFEBEE;border-left:4px solid var(--err)}
.status-name{font-weight:600;font-size:14px}.status-detail{font-size:12px;color:var(--txt2);margin-top:2px}.status-badge{font-size:20px}
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bg2);align-items:flex-start}.feed-item:last-child{border:none}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}.feed-dot.green{background:var(--ok)}.feed-dot.blue{background:var(--blue)}
.feed-text{font-size:13px}.feed-time{font-size:11px;color:var(--txt3);margin-top:2px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:16px;display:inline-block}.badge-g{background:#E8F5E9;color:var(--ok)}.badge-y{background:#FFF3E0;color:var(--warn)}.badge-r{background:#FFEBEE;color:var(--err)}.badge-b{background:#E3F2FD;color:var(--blue)}
/* WORKOUT BUILDER */
.wb-form{display:grid;gap:14px}.wb-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wb-full{grid-column:1/-1}
.wb-label{font-size:12px;font-weight:500;margin-bottom:4px;display:block;color:var(--txt2)}.wb-input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:13px}.wb-input:focus{outline:none;border-color:var(--pri)}
.ex-row{background:var(--bg2);border-radius:8px;padding:14px;margin-bottom:10px;position:relative}.ex-row .ex-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px}
.ex-remove{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--err);cursor:pointer;font-size:14px}
.ex-move{background:none;border:none;cursor:pointer;font-size:14px;color:var(--pri);padding:2px 6px}.ex-move:hover{color:var(--pri-d)}
.ex-input{padding:8px 10px;border:1px solid var(--bdr);border-radius:5px;font-family:inherit;font-size:12px;width:100%}.ex-input:focus{outline:none;border-color:var(--pri)}.ex-label{font-size:10px;color:var(--txt3);margin-bottom:2px;display:block}
/* SESSION CARDS */
.sess-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:box-shadow .2s}.sess-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.sess-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.sess-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--pri-d)}.sess-time{font-size:12px;color:var(--acc);font-weight:500}.sess-date{font-size:12px;color:var(--txt2)}
.sess-ex{margin-top:10px}.sess-ex-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg2);font-size:13px}.sess-ex-row:last-child{border:none}.sess-ex-name{font-weight:500}.sess-ex-detail{color:var(--txt2)}
.sess-notes{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:12px;color:var(--pri-d);border-left:3px solid var(--acc-l);font-style:italic}
.sess-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
/* CAPACITY CHECK-IN - DARK PREMIUM */
.cap-wrap{background:linear-gradient(135deg,#2C1F26,#3D2B33,#4A3340);border-radius:16px;padding:30px 24px;min-height:400px}
.cap-wrap .card-t{color:var(--acc-l);font-size:18px}.cap-wrap .card-c{color:rgba(255,255,255,.65)}
.cap-q{margin-bottom:24px}.cap-q-title{font-size:14px;font-weight:600;margin-bottom:10px;color:#fff}
.cap-range{display:flex;gap:4px;align-items:center}.cap-hints{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px;color:rgba(255,255,255,.4)}
.cap-card{flex:1;padding:14px 0;border:2px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.04);text-align:center;cursor:pointer;transition:all .25s;font-family:inherit;font-size:15px;font-weight:600;color:rgba(255,255,255,.6)}
.cap-card:hover{border-color:var(--acc);background:rgba(167,124,146,.15);color:#fff;transform:translateY(-2px)}
.cap-card.sel{border-color:var(--acc-l);background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;box-shadow:0 4px 16px rgba(115,74,90,.4);transform:translateY(-2px)}
.cap-result{text-align:center;padding:30px 20px;border-radius:12px;margin-top:20px}
.cap-result.green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}.cap-result.yellow{background:linear-gradient(135deg,#E65100,#F57C00)}.cap-result.red{background:linear-gradient(135deg,#B71C1C,#D32F2F)}
.cap-zone{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:8px;color:#fff}.cap-msg{font-size:13px;line-height:1.7;max-width:500px;margin:0 auto 16px;font-style:italic;color:rgba(255,255,255,.9)}
.pill-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.pill{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:2px solid;transition:all .2s;font-family:inherit}
.pill.green{border-color:var(--ok);color:var(--ok);background:transparent}.pill.green.sel,.pill.green:hover{background:var(--ok);color:#fff}
.pill.yellow{border-color:var(--warn);color:var(--warn);background:transparent}.pill.yellow.sel,.pill.yellow:hover{background:var(--warn);color:#fff}
.pill.red{border-color:#EF9A9A;color:#EF9A9A;background:transparent}.pill.red.sel,.pill.red:hover{background:var(--err);color:#fff}
/* TRACKER */
.meal-slot{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:8px}
.meal-name{font-weight:500;font-size:14px}.meal-btns{display:flex;gap:6px}
.meal-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--bdr);background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.meal-btn:hover{border-color:var(--pri)}.meal-btn.check{background:var(--ok);border-color:var(--ok);color:#fff}.meal-btn.x{background:var(--err);border-color:var(--err);color:#fff}.meal-btn.miss{background:var(--txt3);border-color:var(--txt3);color:#fff}
.water-track{display:flex;align-items:center;gap:16px;padding:16px;border:2px solid var(--blue);border-radius:12px;background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}
.water-oz{font-size:28px;font-weight:700;color:var(--blue);min-width:80px;text-align:center}.water-label{font-size:11px;color:#1565C0;text-transform:uppercase;letter-spacing:.5px}
.water-plus{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-weight:700}.water-plus:hover{background:#1565C0;transform:scale(1.1)}
.water-minus{width:36px;height:36px;border-radius:50%;background:#BBDEFB;color:var(--blue);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}.water-minus:hover{background:#90CAF9}
/* SCHEDULE */
.sched-view-toggle{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.sv-btn{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;background:#fff;border:none;font-family:inherit;transition:all .2s}.sv-btn.on{background:var(--pri);color:#fff}
.day-card{border:1px solid var(--bdr);border-radius:8px;padding:14px;margin-bottom:10px}.day-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-card-date{font-weight:600;font-size:14px;color:var(--pri)}.day-card-session{font-size:13px;color:var(--txt2);padding:8px;background:var(--bg2);border-radius:6px;margin-bottom:4px}
.add-sched-btn{width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:fixed;bottom:24px;right:24px;box-shadow:0 4px 12px rgba(115,74,90,.4);z-index:100;transition:all .2s}.add-sched-btn:hover{transform:scale(1.1)}
/* AVAILABILITY */
.avail-day{margin-bottom:16px;border:1px solid var(--bdr);border-radius:10px;padding:16px;background:#fff}
.avail-day-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.avail-day-name{font-weight:700;font-size:14px;color:var(--pri)}.avail-day-date{font-size:11px;color:var(--txt3)}.avail-slot-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;background:var(--bg2);border-radius:6px}
.avail-sel{padding:7px 8px;border:1px solid var(--bdr);border-radius:5px;font-family:inherit;font-size:12px;background:#fff}
.avail-sep{color:var(--txt3);font-size:12px;font-weight:500}
.avail-rm{background:none;border:none;color:var(--err);cursor:pointer;font-size:16px;font-weight:700;padding:0 4px}.avail-rm:hover{color:#B71C1C}
.avail-add{background:none;border:2px dashed var(--bdr);border-radius:6px;padding:8px;width:100%;cursor:pointer;color:var(--pri);font-size:13px;font-weight:500;font-family:inherit;text-align:center;transition:all .2s;margin-bottom:8px}.avail-add:hover{border-color:var(--pri);background:rgba(115,74,90,.05)}
.copy-btns{display:flex;gap:8px;margin-top:8px}.copy-btns button{flex:1;padding:6px 10px;font-size:12px}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-t{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--pri-d);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--txt2);padding:4px}
.cb-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px;border-radius:6px;border:1px solid var(--bdr);margin-bottom:6px}.cb-row:hover{background:var(--bg2)}.cb-row input{cursor:pointer;width:18px;height:18px;accent-color:var(--pri)}
.cl-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}.cl-row:hover{background:var(--bg2)}.cl-name{font-weight:600;font-size:14px}.cl-email{font-size:12px;color:var(--txt2)}
.client-detail{background:var(--bg2);border-radius:8px;padding:16px;margin-top:12px}.cd-section{margin-bottom:14px}.cd-section:last-child{margin:0}.cd-title{font-size:12px;font-weight:600;color:var(--pri);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.empty{text-align:center;padding:40px 20px;color:var(--txt2)}.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}.empty-text{font-size:14px}.empty-sub{font-size:12px;color:var(--txt3);margin-top:6px}
.coach-card{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg2);border-radius:10px;margin-top:16px}
.coach-avatar{width:50px;height:50px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.coach-info{flex:1}.coach-name{font-weight:600;font-size:15px;color:var(--pri)}.coach-label{font-size:11px;color:var(--txt3)}
.msg-icon{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}.msg-icon:hover{background:var(--pri-d);transform:scale(1.1)}
/* TODAY SCHED */
.today-sched{border:2px solid var(--pri);border-radius:10px;padding:16px;transition:all .2s;margin-bottom:20px}.today-sched:hover{background:var(--bg2)}
.today-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);margin-bottom:6px}.today-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--pri-d);font-weight:600}.today-time{font-size:13px;color:var(--txt2);margin-top:4px}
.today-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zone-btn{padding:10px 18px;border-radius:8px;border:2px solid;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;background:#fff}
.zone-btn.g{border-color:var(--ok);color:var(--ok)}.zone-btn.g:hover,.zone-btn.g.sel{background:var(--ok);color:#fff}
.zone-btn.y{border-color:var(--warn);color:#9E6600}.zone-btn.y:hover,.zone-btn.y.sel{background:var(--warn);color:#fff}
.zone-btn.r{border-color:var(--err);color:var(--err)}.zone-btn.r:hover,.zone-btn.r.sel{background:var(--err);color:#fff}
/* PROGRAM PILL */
.prog-pill{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;font-weight:600;font-size:15px;cursor:pointer;transition:all .2s;border:none;font-family:inherit;margin-bottom:16px}
.prog-pill:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(115,74,90,.3)}
.prog-sessions{border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.prog-sess-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bg2);transition:background .2s}.prog-sess-item:last-child{border:none}.prog-sess-item:hover{background:var(--bg)}
.prog-sess-done{color:var(--ok);font-weight:600}.prog-sess-pending{color:var(--txt3)}
.chart-wrap{position:relative;width:160px;height:160px;margin:20px auto}
.chart-wrap svg{transform:rotate(-90deg)}.chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.chart-pct{font-size:28px;font-weight:700;color:var(--pri)}.chart-label{font-size:11px;color:var(--txt2)}
.food-entry{display:flex;gap:8px;margin-bottom:8px}.food-entry input{flex:1}
@media(max-width:600px){.ex-row .ex-grid{grid-template-columns:1fr 1fr}.wb-row{grid-template-columns:1fr}.igrid3{grid-template-columns:1fr}.nav-tab{padding:10px 10px;font-size:11px}.main{padding:16px}.top-bar{padding:10px 16px}.chart-wrap{width:130px;height:130px}.cap-card{padding:10px 0;font-size:13px}.copy-btns{flex-direction:column}}
</style>
</head>
<body>
<div id="authScreen" class="auth-wrap"><div class="auth-box"><div class="auth-hdr"><div class="logo">The SISS Client Portal™</div><div class="logo-tag">Your private hub for capacity-based training, tracking, and guided progression.</div></div>
<div id="msgBox" class="msg"></div>
<div id="loginForm"><div class="fg"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com"></div><div class="fg"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
<button class="btn btn-p" id="loginBtn" onclick="handleLogin()">Login</button><button class="btn btn-s" onclick="showForm('signup')">Don't have an account? Sign up</button></div>

<div class="fg"><label>Password (6+ characters)</label><input type="password" id="signupPassword" placeholder="••••••••" minlength="6"></div><div class="fg"><label>Account Type</label><select id="signupRole"><option value="client">Client</option><option value="coach">Coach</option></select></div>

<div class="nav" id="navBar"></div><div class="main" id="mainContent"></div></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCpF4ykT6BCmfNXTR-o5fsdwMqmsLO5VDA",authDomain:"rebuild-and-rise.firebaseapp.com",projectId:"rebuild-and-rise",storageBucket:"rebuild-and-rise.firebasestorage.app",messagingSenderId:"87951065832",appId:"1:87951065832:web:840c590cfa0580600b3f5d"});
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
const SESSION_MS=2*60*60*1000;let lastAct=Date.now(),tmrInt=null,CUR=null,CDATA=null,exercises=[],allClients=[],allSessions=[],allProgress=[];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TIMES=[];for(let h=5;h<=21;h++)for(let m=0;m<60;m+=15){const hr=h>12?h-12:h===0?12:h;TIMES.push({v:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,l:`${hr}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`})}
function devId(){let i=localStorage.getItem('siss_dev');if(!i){i='d_'+Math.random().toString(36).substr(2,10)+'_'+Date.now();localStorage.setItem('siss_dev',i)}return i}
function timeAgo(d){const s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function todayStr(){return new Date().toISOString().split('T')[0]}
function getDateLabel(daysFromNow){const d=new Date();d.setDate(d.getDate()+daysFromNow);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}

// AUTH
auth.onAuthStateChanged(async u=>{if(u){try{const d=await db.collection('users').doc(u.uid).get();CUR=u;CDATA=d.exists?d.data():{accountType:'client',name:'',email:u.email};showShell()}catch(e){CUR=u;CDATA={accountType:'client'};showShell()}}else showAuth()});
function showForm(t){document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('signupForm').classList.toggle('hidden',t!=='signup');hideMsg()}
async function handleLogin(){const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPassword').value;if(!e||!p){showMsg('Enter email and password.','error');return}const b=document.getElementById('loginBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Logging in...';try{const c=await auth.signInWithEmailAndPassword(e,p);await db.collection('users').doc(c.user.uid).set({lastDeviceId:devId(),lastLoginTime:TS()},{merge:true})}catch(err){showMsg('Login failed. '+(err.code==='auth/invalid-credential'?'Invalid email or password.':err.message),'error');b.disabled=false;b.innerHTML='Login'}}
async function handleSignup(){const n=document.getElementById('signupName').value.trim(),e=document.getElementById('signupEmail').value.trim(),p=document.getElementById('signupPassword').value,r=document.getElementById('signupRole').value;if(!n||!e||!p){showMsg('Fill in all fields.','error');return}if(p.length<6){showMsg('Password 6+ chars.','error');return}const b=document.getElementById('signupBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Creating...';try{const c=await auth.createUserWithEmailAndPassword(e,p);await db.collection('users').doc(c.user.uid).set({email:e,name:n,accountType:r,lastDeviceId:devId(),createdAt:TS(),lastLoginTime:TS()})}catch(err){showMsg('Signup failed. '+err.message,'error');b.disabled=false;b.innerHTML='Create Account'}}
function handleLogout(){if(tmrInt)clearInterval(tmrInt);auth.signOut()}
function showAuth(){document.getElementById('authScreen').style.display='flex';document.getElementById('shell').classList.remove('on');['loginBtn','signupBtn'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=false;b.innerHTML=id==='loginBtn'?'Login':'Create Account'}});showForm('login');hideMsg()}
function showMsg(t,tp){const b=document.getElementById('msgBox');b.textContent=t;b.className='msg '+tp+' vis'}
function hideMsg(){document.getElementById('msgBox').className='msg'}
function toast(t){const d=document.createElement('div');d.style.cssText='position:fixed;top:20px;right:20px;background:#E8F5E9;color:#4CAF50;padding:14px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function startTimer(){lastAct=Date.now();['click','keydown','scroll','touchstart'].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));if(tmrInt)clearInterval(tmrInt);tmrInt=setInterval(()=>{const r=Math.max(0,SESSION_MS-(Date.now()-lastAct));document.getElementById('timerDisplay').textContent=`${String(Math.floor(r/3600000)).padStart(2,'0')}:${String(Math.floor((r%3600000)/60000)).padStart(2,'0')}:${String(Math.floor((r%60000)/1000)).padStart(2,'0')}`;if(r<=0){clearInterval(tmrInt);handleLogout()}const bar=document.querySelector('.sess-bar');if(r<300000){bar.style.background='linear-gradient(135deg,#FFEBEE,#FFCDD2)';bar.style.color='#C62828'}else{bar.style.background='';bar.style.color=''}},1000)}

function showShell(){document.getElementById('authScreen').style.display='none';document.getElementById('shell').classList.add('on');document.getElementById('dispEmail').textContent=CUR.email;const isC=CDATA.accountType==='coach';document.getElementById('dispRole').textContent=isC?'Coach':'Client';document.getElementById('dashTitle').textContent=isC?'SISS Portal — Coach View':'SISS Portal — My Dashboard';buildNav(isC);startTimer()}
function buildNav(isC){const nav=document.getElementById('navBar'),main=document.getElementById('mainContent');nav.innerHTML='';main.innerHTML='';
const tabs=isC?[{id:'dashboard',label:'Dashboard'},{id:'clients',label:'Clients'},{id:'builder',label:'Create Workout'},{id:'library',label:'Workout Library'},{id:'schedule',label:'Schedule'}]
:[{id:'dashboard',label:'Dashboard'},{id:'capacity',label:'Capacity Check-In'},{id:'tracker',label:'Tracker'},{id:'guides',label:'Guides'},{id:'programs',label:'Programs'},{id:'schedule',label:'Schedule'},{id:'messages',label:'Messages'}];
tabs.forEach((t,i)=>{const tab=document.createElement('div');tab.className='nav-tab'+(i===0?' on':'');tab.textContent=t.label;tab.dataset.tab=t.id;
tab.onclick=()=>{nav.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('on'));tab.classList.add('on');main.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('on'));document.getElementById('panel-'+t.id).classList.add('on');loadTab(t.id)};
nav.appendChild(tab);const panel=document.createElement('div');panel.id='panel-'+t.id;panel.className='tab-panel'+(i===0?' on':'');main.appendChild(panel)});
if(isC){loadCoachData().then(()=>{buildCoachDashboard();buildWorkoutCreator()})}else{buildClientDashboard();buildCapacityTab();buildTrackerTab();buildGuidesTab();buildProgramsTab();buildClientScheduleTab();buildMessagesTab()}}
function loadTab(id){const isC=CDATA.accountType==='coach';if(isC){if(id==='dashboard'){loadCoachData().then(buildCoachDashboard)}if(id==='clients')buildClientsTab();if(id==='builder')buildWorkoutCreator();if(id==='library')buildLibraryTab();if(id==='schedule')buildCoachSchedule()}
else{if(id==='dashboard')buildClientDashboard();if(id==='capacity')buildCapacityTab();if(id==='tracker')buildTrackerTab();if(id==='programs')buildProgramsTab();if(id==='schedule')buildClientScheduleTab()}}

async function loadCoachData(){try{let s=await db.collection('users').where('accountType','==','client').get();allClients=[];s.forEach(d=>allClients.push({id:d.id,...d.data()}));s=await db.collection('scheduledSessions').where('coachId','==',CUR.uid).get();allSessions=[];s.forEach(d=>allSessions.push({id:d.id,...d.data()}));s=await db.collection('clientProgress').where('coachId','==',CUR.uid).get();allProgress=[];s.forEach(d=>allProgress.push({id:d.id,...d.data()}))}catch(e){console.error(e)}}

// ===== COACH DASHBOARD =====
let coachAvail={};
function buildCoachDashboard(){const p=document.getElementById('panel-dashboard');
let statusHtml='';allClients.forEach(c=>{const asgn=allSessions.filter(s=>s.assignedClients?.includes(c.id)).length;const comp=allProgress.filter(pr=>pr.clientId===c.id).length;const missed=asgn-comp;const ll=c.lastLoginTime?.toDate?c.lastLoginTime.toDate():null;const dsl=ll?Math.floor((Date.now()-ll.getTime())/864e5):999;
let st='green',si='🟢',stxt='On track';if(missed>=3||!c.lastLoginTime){st='red';si='🔴';stxt=missed>=3?`Missed ${missed} workouts`:'No activity'}else if(missed>=2||dsl>=2){st='yellow';si='🟡';stxt=dsl>=2?`Inactive ${dsl}d`:`Missed ${missed}`}
statusHtml+=`<div class="status-card ${st}"><div><div class="status-name">${c.name||c.email}</div><div class="status-detail">${stxt} · ${comp}/${asgn} completed</div></div><div class="status-badge">${si}</div></div>`});
let feedItems=[];allProgress.forEach(pr=>{const cl=allClients.find(c=>c.id===pr.clientId);feedItems.push({text:`${cl?cl.name||cl.email:'?'} completed "${pr.title}"`,time:pr.completedAt?.toDate?pr.completedAt.toDate():null,dot:'green'})});
allSessions.forEach(s=>{feedItems.push({text:`You published "${s.title}" (${s.assignedClients?.length||0} client(s))`,time:s.createdAt?.toDate?s.createdAt.toDate():null,dot:'blue'})});
feedItems.sort((a,b)=>(b.time?.getTime()||0)-(a.time?.getTime()||0));feedItems=feedItems.slice(0,10);
p.innerHTML=`<div class="banner"><h2>Welcome Back, Coach</h2><p>Manage your clients, create workouts, and track progress.</p></div>
<div class="igrid3"><div class="ibox"><div class="ibox-l">Total Clients</div><div class="ibox-v">${allClients.length}</div></div><div class="ibox"><div class="ibox-l">Workouts</div><div class="ibox-v">${allSessions.length}</div></div><div class="ibox"><div class="ibox-l">Completions</div><div class="ibox-v">${allProgress.length}</div></div></div>
<div class="card" style="margin-top:18px"><div class="card-t">Program Status</div>${statusHtml||'<div class="empty"><div class="empty-text">No clients yet</div></div>'}</div>
<div class="card"><div class="card-t">Activity Feed</div>${feedItems.length?feedItems.map(f=>`<div class="feed-item"><div class="feed-dot ${f.dot}"></div><div><div class="feed-text">${f.text}</div><div class="feed-time">${f.time?timeAgo(f.time):''}</div></div></div>`).join(''):'<div class="empty"><div class="empty-text">No activity yet</div></div>'}</div>
<div class="card"><div class="card-t">Set Your Weekly Availability</div><div class="card-c" style="margin-bottom:14px">Add multiple time slots per day for client booking. Use breaks between slots.</div><div id="coachAvail"></div><button class="btn btn-p" style="margin-top:14px" onclick="saveAvailability()">Save Availability</button><div id="availMsg" class="msg" style="margin-top:8px"></div></div>`;
loadAvailability()}

async function loadAvailability(){try{const d=await db.collection('coachAvailability').doc(CUR.uid).get();if(d.exists)coachAvail=d.data().slots||{}}catch(e){console.log('Avail load:',e)}renderAvailability()}

function renderAvailability(){const el=document.getElementById('coachAvail');if(!el)return;let html='';
for(let dow=0;dow<7;dow++){const slots=coachAvail[dow]||[];const dateLabel=getDateLabel(dow-new Date().getDay());
html+=`<div class="avail-day"><div class="avail-day-hdr"><div><div class="avail-day-name">${DAYS[dow]}</div><div class="avail-day-date">${dateLabel}</div></div><span style="font-size:12px;color:var(--txt3)">${slots.length?slots.length+' slot(s)':'Off'}</span></div>`;
if(slots.length){slots.forEach((slot,idx)=>{html+=`<div class="avail-slot-row"><select class="avail-sel" onchange="updateSlot(${dow},${idx},'from',this.value)">${TIMES.map(t=>`<option value="${t.v}" ${slot.from===t.v?'selected':''}>${t.l}</option>`).join('')}</select>
<span class="avail-sep">to</span>
<select class="avail-sel" onchange="updateSlot(${dow},${idx},'to',this.value)">${TIMES.map(t=>`<option value="${t.v}" ${slot.to===t.v?'selected':''}>${t.l}</option>`).join('')}</select>
<button class="avail-rm" onclick="rmSlot(${dow},${idx})">✕</button></div>`})}
html+=`<button class="avail-add" onclick="addSlot(${dow})">+ Add Time Slot</button><div class="copy-btns"><button class="btn btn-sm btn-s" onclick="copySlots(${dow},${dow}-1||6)">Copy from prev day</button><button class="btn btn-sm btn-s" onclick="copyWeek(${dow})">Copy to rest of week</button></div></div>`}
el.innerHTML=html}

function addSlot(dow){if(!coachAvail[dow])coachAvail[dow]=[];coachAvail[dow].push({from:'09:00',to:'12:00'});renderAvailability()}
function rmSlot(dow,idx){if(coachAvail[dow])coachAvail[dow].splice(idx,1);renderAvailability()}
function updateSlot(dow,idx,field,val){if(coachAvail[dow]&&coachAvail[dow][idx])coachAvail[dow][idx][field]=val}
function copySlots(fromDow,toDow){if(coachAvail[fromDow]&&coachAvail[fromDow].length){coachAvail[toDow]=JSON.parse(JSON.stringify(coachAvail[fromDow]));renderAvailability();toast('Copied!')}}
function copyWeek(startDow){for(let i=startDow+1;i<7;i++){if(coachAvail[startDow]&&coachAvail[startDow].length){coachAvail[i]=JSON.parse(JSON.stringify(coachAvail[startDow]))}}}

async function saveAvailability(){try{await db.collection('coachAvailability').doc(CUR.uid).set({slots:coachAvail,updatedAt:TS()});const m=document.getElementById('availMsg');m.className='msg success vis';m.textContent='Availability saved!';setTimeout(()=>m.classList.remove('vis'),3000)}catch(e){const m=document.getElementById('availMsg');m.className='msg error vis';m.textContent='Error: '+e.message}}

// ===== CLIENTS TAB =====
function buildClientsTab(){const p=document.getElementById('panel-clients');if(!allClients.length){p.innerHTML='<div class="card"><div class="card-t">Your Clients</div><div class="empty"><div class="empty-icon">👥</div><div class="empty-text">No clients yet</div></div></div>';return}
let h='<div class="card"><div class="card-t">Your Clients</div>';allClients.forEach(c=>{const prog=allProgress.filter(pr=>pr.clientId===c.id);const asgn=allSessions.filter(s=>s.assignedClients?.includes(c.id));const missed=asgn.length-prog.length;let bg='badge-g',bt='On Track';if(missed>=3){bg='badge-r';bt='Needs Attention'}else if(missed>=2){bg='badge-y';bt='Watch'}\nh+=`<div class="cl-row" onclick="showClientDetail('${c.id}')\"><div><div class="cl-name">${c.name||'Unnamed'}</div><div class="cl-email">${c.email}</div></div><span class="badge ${bg}">${bt}</span></div>`});h+='</div><div id="clientDetailArea"></div>';p.innerHTML=h}\nasync function showClientDetail(cid){const c=allClients.find(x=>x.id===cid);if(!c)return;const prog=allProgress.filter(pr=>pr.clientId===cid);const asgn=allSessions.filter(s=>s.assignedClients?.includes(cid));\nlet progH=prog.length?prog.slice(0,5).map(pr=>`<div style="padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px"><div style="display:flex;justify-content:space-between"><strong>✓ ${pr.title}</strong><span class="badge badge-${pr.capacityLevel==='green'||pr.capacityLevel==='🟢'?'g':pr.capacityLevel==='yellow'||pr.capacityLevel==='🟡'?'y':'r'}">${pr.capacityLevel||'—'}</span></div><div style="font-size:11px;color:var(--txt3)">${pr.completedAt?.toDate?pr.completedAt.toDate().toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}</div></div>`).join(''):'<span style="color:var(--txt3);font-size:13px">None yet</span>';\ndocument.getElementById('clientDetailArea').innerHTML=`<div class="card"><div class="card-t">${c.name||c.email} — Details</div><div class="client-detail"><div class="cd-section"><div class="cd-title">Progress (${prog.length}/${asgn.length})</div><div style="background:var(--bdr);border-radius:4px;height:8px;margin:8px 0"><div style="background:var(--ok);height:100%;border-radius:4px;width:${asgn.length?Math.round(prog.length/asgn.length*100):0}%"></div></div></div><div class="cd-section"><div class="cd-title">Recent Completions</div>${progH}</div><div class="cd-section"><div class="cd-title">Account Info</div><div style="font-size:13px;color:var(--txt2)">Email: ${c.email}<br>Joined: ${c.createdAt?.toDate?c.createdAt.toDate().toLocaleDateString():''}<br>Last Login: ${c.lastLoginTime?.toDate?timeAgo(c.lastLoginTime.toDate()):''}</div></div></div></div>`;document.getElementById('clientDetailArea').scrollIntoView({behavior:'smooth'})}

// ===== WORKOUT BUILDER =====
async function buildWorkoutCreator(){exercises=[{name:'',type:'General',sets:'',reps:'',weight:'',tempo:'',videoLink:''}];
let co='<option value="">— Save to Library (assign later) —</option>';allClients.forEach(c=>{co+=`<option value="${c.id}">${c.name||c.email}</option>`});
document.getElementById('panel-builder').innerHTML=`<div class="card"><div class="card-t">Create Workout Session</div><div class="wb-form">
<div class="wb-row"><div><label class="wb-label">Session Title</label><input class="wb-input" id="wbTitle" placeholder="e.g., Lower Body Foundation"></div><div><label class="wb-label">Type</label><select class="wb-input" id="wbType"><option value="workout">Workout</option><option value="live-training">Live Training</option><option value="form-review">Form Review</option></select></div></div>
<div class="wb-row"><div><label class="wb-label">Assign To</label><select class="wb-input" id="wbClient">${co}</select></div><div><label class="wb-label">Duration</label><select class="wb-input"><option value="40">40 min (Standard)</option></select></div></div>
<div class="wb-full"><label class="wb-label">Video Link (optional)</label><input class="wb-input" id="wbVideo" placeholder="YouTube, Zoom link"></div>
<div class="wb-full"><label class="wb-label">Coach Notes</label><textarea class="wb-input" id="wbNotes" placeholder="e.g., Focus on depth on squats." style="min-height:70px;resize:vertical"></textarea></div>
<div class="wb-full"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="wb-label" style="margin:0">Exercises</span><button class="btn btn-sm btn-p" onclick="addEx()">+ Add</button></div><div id="exList"></div></div>
<div class="wb-full" style="display:flex;gap:8px"><button class="btn btn-p btn-green" id="pubBtn" onclick="pubSess(true)" style="flex:1">Assign & Publish</button><button class="btn btn-p btn-warn" onclick="pubSess(false)" style="flex:1">Save to Library</button></div>
<div id="wbMsg" class="msg" style="margin-top:8px"></div></div></div>`;renderEx()}
function renderEx(){document.getElementById('exList').innerHTML=exercises.map((e,i)=>`<div class="ex-row">
<div style="position:absolute;top:8px;right:8px;display:flex;gap:2px"><button class="ex-move" onclick="moveEx(${i},-1)" title="Move up">▲</button><button class="ex-move" onclick="moveEx(${i},1)" title="Move down">▼</button><button class="ex-remove" onclick="rmEx(${i})">✕</button></div>
<div class="ex-grid"><div><div class="ex-label">Exercise</div><input class="ex-input" value="${e.name}" onchange="exercises[${i}].name=this.value" placeholder="Squat"></div><div><div class="ex-label">Type</div><select class="ex-input" onchange="exercises[${i}].type=this.value"><option value="General" ${e.type==='General'?'selected':''}>General</option><option value="Mobility" ${e.type==='Mobility'?'selected':''}>Mobility</option><option value="Plyo" ${e.type==='Plyo'?'selected':''}>Plyo</option></select></div><div><div class="ex-label">Sets</div><input class="ex-input" value="${e.sets}" onchange="exercises[${i}].sets=this.value" placeholder="4"></div><div><div class="ex-label">Reps</div><input class="ex-input" value="${e.reps}" onchange="exercises[${i}].reps=this.value" placeholder="5"></div><div><div class="ex-label">Tempo</div><input class="ex-input" value="${e.tempo||''}" onchange="exercises[${i}].tempo=this.value" placeholder="3-1-2"></div></div>
<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><div class="ex-label">Weight</div><input class="ex-input" value="${e.weight}" onchange="exercises[${i}].weight=this.value" placeholder="185 lbs"></div><div><div class="ex-label">Form Video URL</div><input class="ex-input" value="${e.videoLink||''}" onchange="exercises[${i}].videoLink=this.value" placeholder="YouTube URL"></div></div></div>`).join('')}
function addEx(){exercises.push({name:'',type:'General',sets:'',reps:'',weight:'',tempo:'',videoLink:''});renderEx()}
function rmEx(i){if(exercises.length>1){exercises.splice(i,1);renderEx()}}
function moveEx(i,dir){const ni=i+dir;if(ni<0||ni>=exercises.length)return;[exercises[i],exercises[ni]]=[exercises[ni],exercises[i]];renderEx()}

async function pubSess(assign){const title=document.getElementById('wbTitle').value.trim(),type=document.getElementById('wbType').value,cid=document.getElementById('wbClient').value,vid=document.getElementById('wbVideo').value.trim(),notes=document.getElementById('wbNotes').value.trim(),msg=document.getElementById('wbMsg');
if(!title){msg.className='msg error vis';msg.textContent='Enter title.';return}if(!exercises.filter(e=>e.name.trim()).length){msg.className='msg error vis';msg.textContent='Add exercise.';return}if(assign&&!cid){msg.className='msg error vis';msg.textContent='Select client or Save to Library.';return}

async function submitCapacity(){const a=capAnswers;if(!a.sleep||!a.soreness||!a.emotional||!a.focus||!a.energy||!a.trueCap){toast('Rate all 6 areas first.');return}
const score=a.trueCap*3+a.emotional*2.5+a.sleep*2+a.energy*1.5+a.focus*1+a.soreness*1;
let zone='green';

else if(a.emotional>=5&&a.sleep<=2)zone=score>=40?'yellow':(score>=25?'yellow':'red');
else if(score>=40)zone='green';else if(score>=25)zone='yellow';else zone='red';

red:{title:'🔴 RED ZONE: Restore',msg:'This is training too. Your nervous system needs recovery, not stress. Restoration is the work today — walk, breathe, stretch, or rest. Honor this.'}};

const multi=zone==='yellow';

document.getElementById('capResult').innerHTML=`<div class="cap-result ${zone}"><div class="cap-zone">${msgs[zone].title}</div><div class="cap-msg">"${msgs[zone].msg}"</div>

try{await db.collection('capacityCheckins').doc(CUR.uid+'_'+todayStr()).set({clientId:CUR.uid,date:todayStr(),scores:a,weightedScore:score,zone,timestamp:TS()})}catch(e){console.error(e)}}

async function openBookModal(){if(!COACH_ID){alert('No coach available');return}
let avail={};try{const ad=await db.collection('coachAvailability').doc(COACH_ID).get();if(ad.exists)avail=ad.data().slots||{};if(!Object.keys(avail).length){alert('Coach has no availability set yet');return}}catch(e){alert('Error loading coach availability')}
let takenSlots=[];try{const bs=await db.collection('bookedSlots').get();bs.forEach(d=>takenSlots.push(d.data()))}catch(e){}
let daysHtml='';const now=new Date();
for(let i=1;i<=14;i++){const d=new Date(now);d.setDate(now.getDate()+i);const dow=d.getDay();
if(!avail[dow]||!avail[dow].length)continue;
const dateStr=d.toISOString().split('T')[0];const dateLabel=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
let slotHtml='';
avail[dow].forEach(slot=>{const from=slot.from,to=slot.to;TIMES.forEach(t=>{if(t.v>=from&&t.v<to){const taken=takenSlots.find(ts=>ts.date===dateStr&&ts.time===t.v);
slotHtml+=`<button class="btn btn-sm ${taken?'btn-s':'btn-p'}" style="margin:3px;${taken?'opacity:.4;cursor:not-allowed':''}" ${taken?'disabled':''} onclick="bookSlot('${dateStr}','${t.v}','${t.l}','${dateLabel}')\">${t.l}${taken?' ✕':''}</button>`}})});
if(slotHtml)daysHtml+=`<div style="margin-bottom:16px"><div style="font-weight:600;font-size:14px;color:var(--pri);margin-bottom:8px">${dateLabel}</div><div style="display:flex;flex-wrap:wrap">${slotHtml}</div></div>`}
const modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML=`<div class="modal"><div class="modal-t"><span>Schedule a Session</span><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
<div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Select an available time slot. Your coach will assign your workout.</div>
${daysHtml||'<div class="empty"><div class="empty-text">No available slots</div><div class="empty-sub">Your coach hasn\\'t set their availability yet</div></div>'}
</div>`;document.body.appendChild(modal)}

async function bookSlot(date,time,timeDisplay,dateLabel){
try{const existing=await db.collection('bookedSlots').where('date','==',date).where('time','==',time).get();
if(!existing.empty){alert('Slot taken!');return}
await db.collection('bookedSlots').add({clientId:CUR.uid,clientName:CDATA.name||CUR.email,date,time,timeDisplay,dateLabel,createdAt:TS()});
document.querySelector('.modal-overlay')?.remove();toast('Booked: '+dateLabel+' '+timeDisplay);renderClientSched()}catch(e){alert('Error: '+e.message)}}

function buildMessagesTab(){document.getElementById('panel-messages').innerHTML=`<div class="card"><div class="card-t">Messages</div><div class="empty"><div class="empty-icon">💬</div><div class="empty-text">Messaging coming soon</div></div></div>`}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('authScreen').style.display!=='none'){if(!document.getElementById('loginForm').classList.contains('hidden'))handleLogin();else handleSignup()}});
</script>
